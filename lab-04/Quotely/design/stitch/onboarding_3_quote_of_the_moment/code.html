<body class="bg-surface-variant flex items-center justify-center min-h-screen p-0 sm:p-4 select-none antialiased">
<!-- Mobile Frame Container (390 x 844 viewport simulation) -->
<main class="w-full max-w-[390px] h-[844px] bg-background text-on-surface flex flex-col justify-between relative overflow-hidden shadow-2xl rounded-[40px] sm:border-[8px] sm:border-surface-variant">
<!-- Top App Bar / Status & Actions Header -->
<header class="w-full px-margin pt-12 pb-4 flex justify-between items-center z-10">
<!-- Segmented Language Switcher -->
<div class="flex items-center bg-surface-container rounded-full p-1 border border-outline-variant/30">
<button aria-label="Switch to English" class="px-3 py-1 rounded-full bg-primary-container text-on-primary text-label-md font-label-md shadow-sm transition-all duration-200" type="button">
          EN
        </button>
<button aria-label="Switch to Ukrainian" class="px-3 py-1 rounded-full text-on-surface-variant hover:text-on-surface text-label-md font-label-md transition-all duration-200" type="button">
          UK
        </button>
</div>
<!-- App Brand Anchor -->
<span class="font-headline-md text-headline-md font-semibold text-primary tracking-tight">
        Quotely
      </span>
<!-- Skip Action Button -->
<button class="text-label-lg font-label-lg text-on-surface-variant hover:text-primary transition-colors py-1 px-2.5 rounded-full hover:bg-surface-container active:scale-95 duration-150" type="button">
        Skip
      </button>
</header>
<!-- Center Literary Editorial Content Canvas -->
<section class="flex-1 flex flex-col items-center justify-center px-margin text-center -mt-6">
<!-- Ambient Decorative Aura Backdrop -->
<div class="relative mb-10 flex items-center justify-center">
<!-- Diffused Subtle Glow Ring -->
<div class="absolute w-48 h-48 rounded-full bg-tertiary-fixed opacity-40 blur-2xl pointer-events-none"></div>
<!-- Center Dusty Rose Circular Badge (~140px diameter) -->
<div class="w-[140px] h-[140px] rounded-full bg-tertiary-fixed flex items-center justify-center shadow-sm relative z-10 transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-[64px] text-tertiary select-none" data-icon="shuffle">
            shuffle
          </span>
</div>
<!-- Scholarly Archival Sparkle Accents -->
<div class="absolute -top-2 -right-1 w-8 h-8 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/30 shadow-xs z-20">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="auto_awesome">
            auto_awesome
          </span>
</div>
<div class="absolute -bottom-1 -left-2 w-7 h-7 rounded-full bg-secondary-container/40 flex items-center justify-center border border-outline-variant/20 shadow-xs z-20">
<span class="material-symbols-outlined text-[14px] text-secondary" data-icon="format_quote">
            format_quote
          </span>
</div>
</div>
<!-- Literary Editorial Serif Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-normal mb-4">
        Quote of the moment
      </h1>
<!-- Description in Manrope -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
        Let serendipity strike with an unexpected spark of insight tailored for your present mood.
      </p>
<!-- Soft Tactile Excerpt Preview Card -->
<div class="mt-8 mx-auto w-full max-w-[310px] bg-surface-container rounded-DEFAULT p-4 border border-outline-variant/20 shadow-sm flex items-center gap-3 text-left">
<div class="w-9 h-9 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="lightbulb">
            lightbulb
          </span>
</div>
<div class="overflow-hidden">
<p class="font-label-sm text-label-sm text-secondary font-semibold uppercase tracking-wider">Serendipitous Discovery</p>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">Fresh daily quotes curated to reflect quiet contemplation.</p>
</div>
</div>
</section>
<!-- Bottom Pager Controls & Linear Progression -->
<footer class="w-full px-margin pb-10 flex flex-col gap-6 z-10">
<!-- Pager Status Stack: Counter & Indicator Dots -->
<div class="flex flex-col items-center gap-2.5">
<!-- Numerical Counter -->
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">
          3 of 4
        </span>
<!-- Page Indicator Track -->
<div aria-label="Onboarding Progress" class="flex items-center gap-2" role="tablist">
<!-- Dot 1: Inactive -->
<span aria-label="Step 1" class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-200"></span>
<!-- Dot 2: Inactive -->
<span aria-label="Step 2" class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-200"></span>
<!-- Dot 3: Active Wider Indigo Pill (#3D4A8C / primary-container) -->
<span aria-current="step" aria-label="Step 3" class="w-7 h-2 rounded-full bg-primary-container transition-all duration-300"></span>
<!-- Dot 4: Inactive -->
<span aria-label="Step 4" class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-200"></span>
</div>

<nav aria-label="Onboarding Navigation" class="flex items-center justify-between w-full pt-1">
<!-- Back Text Button -->
<button class="py-3 px-5 rounded-full text-label-lg font-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-150 active:scale-95 flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">
            arrow_back
          </span>

        </button>

<button class="h-12 px-8 rounded-full bg-primary text-on-primary text-label-lg font-label-lg shadow-sm hover:opacity-95 active:scale-95 transition-all duration-150 flex items-center gap-2" type="button">
<span>Next</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">
            arrow_forward
          </span>
</button>
</nav>
