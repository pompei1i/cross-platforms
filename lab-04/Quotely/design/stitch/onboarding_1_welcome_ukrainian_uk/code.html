<body class="bg-[#e9e5de] font-body-md text-on-surface antialiased flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- Mobile Frame Container (390 x 844 target canvas) -->
<main class="w-full max-w-[390px] h-[844px] bg-surface flex flex-col justify-between relative overflow-hidden shadow-2xl sm:rounded-[44px] border border-outline-variant/20">
<!-- Top Bar -->
<header class="w-full pt-4 px-margin flex items-center justify-between z-20">
<!-- Language Switcher: EN | UK -->
<nav aria-label="Language Selector" class="inline-flex items-center p-1 bg-surface-container rounded-full">
<button class="px-3 py-1 text-on-surface-variant font-label-md text-label-md rounded-full transition-colors hover:text-primary" type="button">
          EN
        </button>
<button class="px-3 py-1 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-sm" type="button">
          UK
        </button>
</nav>
<!-- Skip Button -->
<button class="px-3 py-1.5 text-on-surface-variant hover:text-primary font-label-lg text-label-lg transition-transform active:scale-95" type="button">
        Пропустити
      </button>
</header>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col justify-center px-margin py-2">
<!-- Center Quote Card -->
<section aria-label="Quote of inspiration" class="relative w-full rounded-[28px] bg-primary-fixed p-7 shadow-sm flex flex-col justify-between overflow-hidden">
<!-- Ambient Decorative Motif -->
<div class="absolute -right-6 -bottom-8 select-none pointer-events-none opacity-10">
<span class="material-symbols-outlined text-[140px] text-primary" data-icon="format_quote">format_quote</span>
</div>
<div>
<!-- Large Indigo Quote Icon -->
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-5">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="format_quote" data-weight="fill" style="font-variation-settings: 'FILL' 1;">format_quote</span>
</div>
<!-- Ukrainian Quote Text -->
<blockquote class="font-quote-featured-mobile text-quote-featured-mobile italic text-primary leading-relaxed font-semibold mb-6">
            «Єдиний спосіб робити великі справи — любити те, що ви робите.»
          </blockquote>
</div>
<!-- Author Attribution -->
<div class="flex items-center justify-between pt-2 border-t border-primary/10">
<cite class="not-italic font-label-lg text-label-lg text-on-primary-fixed-variant tracking-wide font-medium">
            — Стів Джобс
          </cite>
<span class="material-symbols-outlined text-primary/60 text-lg" data-icon="auto_stories">auto_stories</span>
</div>
</section>
<!-- Editorial Intro Copy Below Card -->
<div class="mt-8 text-center px-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3 tracking-tight">
          Ласкаво просимо до Quotely
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto leading-relaxed">
          Відкрийте для себе вічну мудрість, глибокі думки та щоденне натхнення для хвилин тихого роздуму.
        </p>
</div>
</div>
<!-- Bottom Controls & Pager -->
<footer class="w-full px-margin pb-8 pt-2 flex flex-col gap-4">
<!-- Pager Counter and Indicator Dots -->
<div class="flex items-center justify-between px-1">
<!-- Progress Counter -->
<span class="font-label-md text-label-md text-on-surface-variant tabular-nums">
          1 з 4
        </span>
<!-- Dots Indicator -->
<div aria-label="Progress dots" class="flex items-center gap-1.5" role="tablist">
<!-- Active Pill -->
<span aria-current="step" class="w-6 h-2 rounded-full bg-primary-container transition-all"></span>
<!-- Inactive Dots -->
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
</div>
<!-- Spacer for balanced alignment -->
<div class="w-8"></div>
</div>
<!-- Action Row -->
<div class="flex items-center justify-between pt-1">
<!-- Left placeholder/spacer for visual balance -->
<div aria-hidden="true" class="w-12 h-12 invisible"></div>
<!-- Next Button (Filled Primary Pill) -->
<button class="h-12 px-6 rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-95 transition-all shadow-sm hover:bg-primary-container" type="button">
<span>Далі</span>
<span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
