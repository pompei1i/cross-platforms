<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-0 sm:p-6 selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Device Container: 390px x 844px -->
<main class="w-full max-w-[390px] h-[844px] max-h-screen sm:max-h-[844px] bg-background flex flex-col justify-between relative overflow-hidden sm:rounded-3xl shadow-2xl">
<!-- Atmospheric Ambient Tint (Subtle Paper Depth) -->
<div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-primary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -left-32 w-64 h-64 rounded-full bg-secondary-fixed opacity-20 blur-3xl pointer-events-none"></div>
<!-- Top Bar: Segmented Switch & Skip Action -->
<header class="flex justify-between items-center w-full px-margin pt-6 pb-2 z-10">
<!-- Language Switch (Segmented Button Control) -->
<div aria-label="Language Selector" class="flex items-center bg-surface-container rounded-full p-1" role="group">
<button class="bg-primary text-on-primary rounded-full px-3 py-1 font-label-md text-label-md transition-all duration-150 focus:outline-none" type="button">
          EN
        </button>
<button class="text-on-surface-variant hover:text-primary rounded-full px-3 py-1 font-label-md text-label-md transition-all duration-150 focus:outline-none" type="button">
          UK
        </button>
</div>
<!-- Skip Button -->
<button class="text-on-surface-variant font-label-lg text-label-lg px-3 py-1.5 rounded-full hover:bg-surface-container active:scale-95 transition-all duration-150 focus:outline-none" type="button">
        Skip
      </button>
</header>
<!-- Center Section: Hero Quote Card & Editorial Copy -->
<section class="flex-1 flex flex-col items-center justify-center px-margin z-10 w-full my-auto">
<!-- Elevated Decorative Quote Card (28px border-radius) -->
<div class="w-full bg-primary-fixed rounded-[28px] p-7 mb-8 relative transition-transform duration-300 hover:scale-[1.01]" style="box-shadow: 0 4px 20px -2px rgba(61, 74, 140, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);">
<!-- Top Icon Row -->
<div class="flex items-center justify-between mb-4">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">format_quote</span>
</div>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider font-semibold">Daily Insight</span>
</div>
<!-- Sample Quote Body -->
<blockquote class="font-quote-featured-mobile text-quote-featured-mobile italic text-primary leading-relaxed mb-6 font-semibold">
          “The only way to do great work is to love what you do.”
        </blockquote>
<!-- Author Attribution -->
<div class="flex items-center justify-between pt-3 border-t border-primary/10">
<cite class="not-italic font-label-lg text-label-lg text-primary font-bold">
            — Steve Jobs
          </cite>
<div class="flex items-center gap-1.5 text-primary opacity-60">
<span class="material-symbols-outlined text-[16px]">auto_stories</span>
<span class="font-label-sm text-label-sm">Curated</span>
</div>
</div>
</div>
<!-- Text Group: Headline and Description -->
<div class="text-center px-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-3 tracking-tight font-semibold">
          Welcome to Quotely
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[290px] mx-auto leading-relaxed">
          Discover timeless wisdom, profound thoughts, and daily inspiration curated for your quiet moments.
        </p>
</div>
</section>
<!-- Bottom Controls: Pager Indicators & Actions -->
<footer class="w-full px-margin pb-9 pt-2 z-10 flex flex-col gap-5">
<!-- Pager Status: Counter and Segmented Dots -->
<div class="flex flex-col items-center gap-2.5">
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-wide">
          1 of 4
        </span>
<!-- Page Indicator Dots -->
<div aria-label="Onboarding Progress" class="flex items-center justify-center gap-2" role="tablist">
<!-- Slide 1 Active (Pill) -->
<span aria-label="Page 1" aria-selected="true" class="w-7 h-2 rounded-full bg-primary-container transition-all duration-300" role="tab"></span>
<!-- Slide 2 Inactive -->
<span aria-label="Page 2" aria-selected="false" class="w-2 h-2 rounded-full bg-outline-variant opacity-60 transition-all duration-200" role="tab"></span>
<!-- Slide 3 Inactive -->
<span aria-label="Page 3" aria-selected="false" class="w-2 h-2 rounded-full bg-outline-variant opacity-60 transition-all duration-200" role="tab"></span>
<!-- Slide 4 Inactive -->
<span aria-label="Page 4" aria-selected="false" class="w-2 h-2 rounded-full bg-outline-variant opacity-60 transition-all duration-200" role="tab"></span>
</div>
</div>
<!-- Action Buttons Row -->
<div class="flex items-center justify-between w-full pt-1">
<!-- Invisible/Placeholder Back element for layout equilibrium -->
<div aria-hidden="true" class="w-20 invisible pointer-events-none">
<button class="font-label-lg text-label-lg py-3 px-4" tabindex="-1" type="button">Back</button>
</div>
<!-- Next Button (Primary Pill with Icon) -->
<button class="inline-flex items-center justify-center gap-2 bg-primary text-on-primary rounded-full pl-6 pr-5 py-3 h-12 font-label-lg text-label-lg active:scale-95 hover:bg-primary-container transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span>Next</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</footer>
</main>
</body></html>
